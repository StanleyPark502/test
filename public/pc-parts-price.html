<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PC 부품 가격 현황</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#08080f;--s1:#10101c;--s2:#181830;--s3:#222244;--bd:#2a2a48;--ac:#6366f1;--ac2:#818cf8;--tx:#e2e8f0;--dm:#64748b;--r:#ef4444;--g:#22c55e;--y:#eab308;--o:#f97316;--cy:#06b6d4;--pk:#ec4899;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
.header{background:linear-gradient(135deg,var(--s1),var(--s2));border-bottom:1px solid var(--bd);padding:20px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.header h1{font-size:20px;font-weight:700}
.header .sub{font-size:12px;color:var(--dm);margin-top:2px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.period-btns{display:flex;gap:4px;background:var(--s2);border-radius:8px;padding:3px}
.period-btn{padding:6px 14px;border:none;border-radius:6px;background:transparent;color:var(--dm);font-size:12px;font-weight:600;cursor:pointer;transition:.2s}
.period-btn.active{background:var(--ac);color:#fff}
.update-btn{padding:8px 18px;background:var(--ac);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.update-btn:active{transform:scale(.96)}
.tabs{display:flex;gap:0;background:var(--s1);border-bottom:1px solid var(--bd);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 20px;border:none;background:transparent;color:var(--dm);font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:.2s}
.tab.active{color:var(--ac2);border-bottom-color:var(--ac)}
.tab:hover{color:var(--tx)}
.sub-tabs{display:flex;gap:6px;padding:10px 24px;background:var(--s1)}
.sub-tab{padding:5px 14px;border-radius:16px;border:1px solid var(--bd);background:transparent;color:var(--dm);font-size:12px;cursor:pointer;transition:.2s}
.sub-tab.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.content{padding:16px 20px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:14px}
.card .lbl{font-size:11px;color:var(--dm);margin-bottom:2px}
.card .name{font-size:13px;font-weight:700;margin-bottom:6px}
.card .price{font-size:20px;font-weight:700}
.card .msrp{font-size:11px;color:var(--dm);margin-top:2px}
.card .chg{font-size:12px;margin-top:4px;font-weight:600}
.card .chg.up{color:var(--r)}.card .chg.down{color:var(--g)}.card .chg.flat{color:var(--y)}
.chart-area{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.chart-area h3{font-size:14px;margin-bottom:10px}
.chart-area canvas{max-height:340px}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--bd);margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:var(--s1);font-size:12px}
th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--bd)}
th{background:var(--s2);color:var(--dm);font-weight:600;position:sticky;top:0}
td:first-child,th:first-child{text-align:left;font-weight:600}
tr:hover td{background:rgba(99,102,241,.04)}
.note{background:var(--s1);border:1px solid var(--bd);border-radius:var(--radius);padding:14px;font-size:12px;color:var(--dm);line-height:1.6;margin-bottom:16px}
.note strong{color:var(--r)}
.src{font-size:11px;color:var(--dm);padding:12px 24px;border-top:1px solid var(--bd)}
.src a{color:var(--ac2)}
@media(max-width:640px){
  .header{padding:14px 16px}.header h1{font-size:17px}
  .cards{grid-template-columns:repeat(2,1fr);gap:8px}
  .card .price{font-size:17px}
  .content{padding:12px 12px 40px}
}
</style>
</head>

  <div><h1>PC 부품 가격 현황</h1><div class="sub">주요 부품 가격 동향 (USD) · 최종 조사: 2026년 3월</div></div>

// 월 라벨 생성
function genLabels(startY,startM,count){
  const r=[];for(let i=0;i<count;i++){const m=(startM+i-1)%12+1;const y=startY+Math.floor((startM+i-1)/12);r.push(y+'-'+String(m).padStart(2,'0'));}return r;
}
// 선형 보간
function interp(start,end,steps){const r=[];for(let i=0;i<steps;i++)r.push(Math.round(start+(end-start)*i/(steps-1)));return r;}
// 여러 구간 연결
function buildPrices(segments){let r=[];segments.forEach((s,i)=>{const d=interp(s[0],s[1],s[2]);if(i>0)d.shift();r=r.concat(d);});return r;}

  hdd:'HDD 평균 46% 상승(2025.9 대비). AI 데이터센터의 대용량 HDD 수요 + 태국 공장 화재로 공급 차질. WD는 2026년분 전량 매진.'

let currentCat='gpu';
let currentSub='nvidia';
let currentPeriod='1Y';
let chart=null;

const periodMonths={'1Y':12,'2Y':24,'3Y':36,'5Y':60};

function getSubOptions(cat){
  if(cat==='gpu')return[['nvidia','NVIDIA'],['amd','AMD']];
  if(cat==='cpu')return[['intel','Intel'],['amd','AMD']];
  return[['all','전체']];
}

function getDataSet(){
  return DATA[currentCat]?.[currentSub]||{};
}

function getSlice(prices,launch){
  const total=60;
  const pm=periodMonths[currentPeriod];
  const startIdx=total-pm;
  return prices.slice(startIdx).map((v,i)=>{
    const globalIdx=startIdx+i;
    if(launch>0 && globalIdx<launch)return null;
    return v===0?null:v;
  });
}

function getLabelsSlice(){
  const pm=periodMonths[currentPeriod];
  return ALL_LABELS.slice(60-pm);
}

function render(){
  // Sub tabs
  const subOpts=getSubOptions(currentCat);
  const stEl=document.getElementById('subTabs');
  if(subOpts.length<=1){stEl.style.display='none';currentSub=subOpts[0][0];}
  else{
    stEl.style.display='flex';
    stEl.innerHTML=subOpts.map(([k,l])=>`<button class="sub-tab${currentSub===k?' active':''}" data-sub="${k}">${l}</button>`).join('');
    stEl.querySelectorAll('.sub-tab').forEach(b=>b.onclick=()=>{currentSub=b.dataset.sub;render();});
  }

  const ds=getDataSet();
  const labels=getLabelsSlice();
  const cont=document.getElementById('content');

  // Summary cards
  let cardsHtml='<div class="cards">';
  for(const[name,d]of Object.entries(ds)){
    const sl=getSlice(d.prices,d.launch||0).filter(v=>v!==null);
    if(sl.length<2){
      const cur=sl[sl.length-1]||'--';
      cardsHtml+=`<div class="card"><div class="lbl">${currentCat.toUpperCase()}</div><div class="name">${name}</div><div class="price">$${cur}</div>${d.msrp?`<div class="msrp">MSRP $${d.msrp}</div>`:''}<div class="chg flat">NEW</div></div>`;
      continue;
    }
    const first=sl[0],last=sl[sl.length-1];
    const diff=last-first;
    const pct=((diff/first)*100).toFixed(1);
    const dir=diff>0?'up':diff<0?'down':'flat';
    const arrow=dir==='up'?'▲':dir==='down'?'▼':'—';
    const msrpHtml=d.msrp?`<div class="msrp">MSRP $${d.msrp}${last>d.msrp*1.1?` · <span style="color:var(--r)">+${Math.round((last/d.msrp-1)*100)}%</span>`:''}</div>`:'';
    cardsHtml+=`<div class="card"><div class="lbl">${currentCat.toUpperCase()}</div><div class="name">${name}</div><div class="price">$${last}</div>${msrpHtml}<div class="chg ${dir}">${arrow} $${Math.abs(diff)} (${pct}%)</div></div>`;
  }
  cardsHtml+='</div>';

  // Note
  const noteHtml=`<div class="note">${NOTES[currentCat]}</div>`;

  // Chart
  const chartHtml='<div class="chart-area"><h3>가격 동향 차트</h3><canvas id="mainChart"></canvas></div>';

  // Table
  let tableHtml='<div class="table-wrap"><table><thead><tr><th>부품</th>';
  const tLabels=labels.filter((_,i)=>i%Math.max(1,Math.floor(labels.length/12))===0||i===labels.length-1);
  // Show all labels but limit display
  const displayLabels=labels.length<=12?labels:labels.filter((_,i)=>i%(Math.ceil(labels.length/12))===0||(i===labels.length-1));
  displayLabels.forEach(l=>tableHtml+=`<th>${l}</th>`);
  tableHtml+='<th>변동</th></tr></thead><tbody>';
  for(const[name,d]of Object.entries(ds)){
    const sl=getSlice(d.prices,d.launch||0);
    const valid=sl.filter(v=>v!==null);
    if(valid.length<2)continue;
    const first=valid[0],last=valid[valid.length-1];
    const pct=(((last-first)/first)*100).toFixed(1);
    const dir=parseFloat(pct)>0?'up':parseFloat(pct)<0?'down':'flat';
    tableHtml+=`<tr><td>${name}</td>`;
    const indices=[];
    for(let i=0;i<labels.length;i++){
      if(labels.length<=12||i%(Math.ceil(labels.length/12))===0||i===labels.length-1)indices.push(i);
    }
    indices.forEach(i=>{
      const v=sl[i];
      tableHtml+=`<td>${v===null?'-':'$'+v}</td>`;
    });
    tableHtml+=`<td class="chg ${dir}">${pct}%</td></tr>`;
  }
  tableHtml+='</tbody></table></div>';

  cont.innerHTML=noteHtml+cardsHtml+chartHtml+tableHtml;

  // Sources
  document.getElementById('sources').innerHTML=`출처: ${SOURCES[currentCat]}`;

  // Draw chart
  if(chart)chart.destroy();
  const ctx=document.getElementById('mainChart').getContext('2d');
  const datasets=[];
  for(const[name,d]of Object.entries(ds)){
    const sl=getSlice(d.prices,d.launch||0);
    datasets.push({
      label:name,data:sl,borderColor:d.color,backgroundColor:d.color+'18',
      borderWidth:2,pointRadius:labels.length>24?1:3,pointHoverRadius:5,tension:.3,fill:false,spanGaps:false
    });
  }
  chart=new Chart(ctx,{
    type:'line',
    data:{labels,datasets},
    options:{
      responsive:true,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{position:'bottom',labels:{color:'#94a3b8',font:{size:11},boxWidth:12,padding:8}},
        tooltip:{backgroundColor:'#1e1e2e',titleColor:'#e2e8f0',bodyColor:'#e2e8f0',
          callbacks:{label:c=>c.parsed.y===null?'':c.dataset.label+': $'+c.parsed.y}}
      },
      scales:{
        x:{ticks:{color:'#64748b',maxTicksLimit:12,maxRotation:45},grid:{color:'#1a1a30'}},
        y:{ticks:{color:'#64748b',callback:v=>'$'+v},grid:{color:'#1a1a30'}}
      }
    }
  });
}

function refreshData(){
  // 최신 월 가격에 시장 변동 시뮬레이션
  for(const cat of Object.values(DATA)){
    for(const sub of Object.values(cat)){
      for(const d of Object.values(sub)){
        const p=d.prices;
        if(p.length>0&&p[p.length-1]>0){
          const last=p[p.length-1];
          const fl=Math.round((Math.random()-.5)*last*0.02);
          p[p.length-1]=Math.max(10,last+fl);
        }
      }
    }
  }
  render();
}

// Event: tabs
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  currentCat=t.dataset.cat;
  const subs=getSubOptions(currentCat);
  currentSub=subs[0][0];
  render();
});

// Event: period
document.querySelectorAll('.period-btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.period-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  currentPeriod=b.dataset.p;
  render();
});

render();
</script>
</body>
