<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Claude Cowork Tasks</title>
<style>
  :root {
    --bg: #0f0f14;
    --surface: #1a1a24;
    --surface2: #24243a;
    --accent: #7c6cf0;
    --accent-light: #9d8ff7;
    --text: #e8e6f0;
    --text-dim: #8888a0;
    --danger: #f04060;
    --success: #40d080;
    --warning: #f0a030;
    --high: #ff4466;
    --medium: #ffaa33;
    --low: #44dd88;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Pretendard', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,15,20,0.92);
    backdrop-filter: blur(20px);
    padding: 16px 20px 12px;
    border-bottom: 1px solid rgba(124,108,240,0.15);
  }
  .header h1 {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent-light), #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .header .subtitle { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .stats {
    display: flex; gap: 12px; padding: 12px 20px;
    overflow-x: auto; scrollbar-width: none;
  }
  .stats::-webkit-scrollbar { display: none; }
  .stat-card {
    flex-shrink: 0;
    background: var(--surface);
    border-radius: 12px;
    padding: 10px 16px;
    min-width: 90px;
    text-align: center;
  }
  .stat-card .num { font-size: 24px; font-weight: 700; }
  .stat-card .label { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .stat-card.pending .num { color: var(--accent-light); }
  .stat-card.progress .num { color: var(--warning); }
  .stat-card.done .num { color: var(--success); }

  .filter-bar {
    display: flex; gap: 8px; padding: 8px 20px;
    overflow-x: auto; scrollbar-width: none;
  }
  .filter-bar::-webkit-scrollbar { display: none; }
  .filter-btn {
    flex-shrink: 0;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid rgba(124,108,240,0.25);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .task-list { padding: 8px 16px 120px; }
  .task-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    border-left: 3px solid var(--accent);
    transition: transform 0.15s;
    position: relative;
  }
  .task-card:active { transform: scale(0.98); }
  .task-card.high { border-left-color: var(--high); }
  .task-card.medium { border-left-color: var(--medium); }
  .task-card.low { border-left-color: var(--low); }
  .task-card.completed-task {
    opacity: 0.5;
    border-left-color: var(--success);
  }
  .task-card .title {
    font-size: 15px; font-weight: 600;
    margin-bottom: 4px;
  }
  .task-card .desc {
    font-size: 13px; color: var(--text-dim);
    margin-bottom: 8px;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .task-meta {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: wrap;
  }
  .tag {
    font-size: 11px; padding: 2px 8px;
    border-radius: 10px;
    background: var(--surface2);
    color: var(--text-dim);
  }
  .priority-badge {
    font-size: 11px; padding: 2px 8px;
    border-radius: 10px; font-weight: 600;
  }
  .priority-badge.high { background: rgba(255,68,102,0.15); color: var(--high); }
  .priority-badge.medium { background: rgba(255,170,51,0.15); color: var(--medium); }
  .priority-badge.low { background: rgba(68,221,136,0.15); color: var(--low); }
  .task-actions {
    display: flex; gap: 8px;
    margin-top: 10px;
  }
  .task-actions button {
    flex: 1; padding: 8px;
    border-radius: 8px; border: none;
    font-size: 12px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
  }
  .btn-complete {
    background: rgba(64,208,128,0.15); color: var(--success);
  }
  .btn-progress {
    background: rgba(240,160,48,0.15); color: var(--warning);
  }
  .btn-delete {
    background: rgba(240,64,96,0.15); color: var(--danger);
  }

  /* FAB */
  .fab {
    position: fixed; bottom: 24px; right: 20px;
    width: 56px; height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #9d6cf0);
    border: none; color: white;
    font-size: 28px; cursor: pointer;
    box-shadow: 0 4px 20px rgba(124,108,240,0.4);
    z-index: 200;
    transition: transform 0.2s;
  }
  .fab:active { transform: scale(0.9); }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--surface);
    border-radius: 20px 20px 0 0;
    padding: 24px 20px 32px;
    width: 100%;
    max-width: 500px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal h2 {
    font-size: 18px; margin-bottom: 20px;
    text-align: center;
  }
  .modal .handle {
    width: 36px; height: 4px;
    background: var(--text-dim);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 13px;
    color: var(--text-dim); margin-bottom: 6px;
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%; padding: 12px 14px;
    background: var(--surface2);
    border: 1px solid rgba(124,108,240,0.2);
    border-radius: 10px;
    color: var(--text); font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus, .form-group textarea:focus {
    border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 80px; }
  .form-group .tag-input-wrap {
    display: flex; gap: 8px;
  }
  .form-group .tag-input-wrap input { flex: 1; }
  .form-group .tag-input-wrap button {
    padding: 8px 16px;
    background: var(--accent);
    color: white; border: none;
    border-radius: 10px; font-size: 14px;
    cursor: pointer;
  }
  .tag-list { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag-list .tag { cursor: pointer; }
  .tag-list .tag:hover { text-decoration: line-through; }
  .submit-btn {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--accent), #9d6cf0);
    color: white; border: none;
    border-radius: 12px;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  .submit-btn:active { opacity: 0.8; }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 14px; }

  .cowork-banner {
    margin: 8px 16px; padding: 12px 16px;
    background: linear-gradient(135deg, rgba(124,108,240,0.12), rgba(157,108,240,0.08));
    border-radius: 12px;
    border: 1px solid rgba(124,108,240,0.2);
    font-size: 12px; color: var(--text-dim);
    line-height: 1.5;
  }
  .cowork-banner strong { color: var(--accent-light); }
</style>
</head>
<body>

<div class="header">
  <h1>Claude Cowork Tasks</h1>
  <div class="subtitle">갤럭시에서 작업 생성 → 랩탑 Claude Code에서 실행</div>
</div>

<div class="stats" id="stats"></div>

<div class="cowork-banner">
  <strong>사용법:</strong> 여기서 작업을 추가하면 랩탑의 Claude Code cowork 모드에서 자동으로 작업 목록을 읽어갑니다.
</div>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-filter="all">전체</button>
  <button class="filter-btn" data-filter="pending">대기중</button>
  <button class="filter-btn" data-filter="in_progress">진행중</button>
  <button class="filter-btn" data-filter="completed">완료</button>
  <button class="filter-btn" data-filter="high">높음</button>
</div>

<div class="task-list" id="taskList"></div>

<button class="fab" id="fabBtn">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="handle"></div>
    <h2 id="modalTitle">새 작업 추가</h2>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>작업 제목 *</label>
      <input type="text" id="titleInput" placeholder="예: API 인증 버그 수정">
    </div>
    <div class="form-group">
      <label>상세 설명</label>
      <textarea id="descInput" placeholder="Claude Code에게 전달할 상세 내용..."></textarea>
    </div>
    <div class="form-group">
      <label>우선순위</label>
      <select id="priorityInput">
        <option value="high">🔴 높음 (High)</option>
        <option value="medium" selected>🟡 보통 (Medium)</option>
        <option value="low">🟢 낮음 (Low)</option>
      </select>
    </div>
    <div class="form-group">
      <label>태그</label>
      <div class="tag-input-wrap">
        <input type="text" id="tagInput" placeholder="태그 입력">
        <button id="addTagBtn">추가</button>
      </div>
      <div class="tag-list" id="tagList"></div>
    </div>
    <button class="submit-btn" id="submitBtn">작업 추가</button>
  </div>
</div>

<script>
const API = window.location.origin + '/api';
let tasks = [];
let currentFilter = 'all';
let editTags = [];

async function fetchTasks() {
  try {
    const res = await fetch(`${API}/tasks`);
    const data = await res.json();
    tasks = data.tasks || [];
    renderStats();
    renderTasks();
  } catch (e) {
    console.error('Failed to fetch tasks:', e);
  }
}

function renderStats() {
  const pending = tasks.filter(t => t.status === 'pending').length;
  const inProgress = tasks.filter(t => t.status === 'in_progress').length;
  const completed = tasks.filter(t => t.status === 'completed').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat-card pending"><div class="num">${pending}</div><div class="label">대기중</div></div>
    <div class="stat-card progress"><div class="num">${inProgress}</div><div class="label">진행중</div></div>
    <div class="stat-card done"><div class="num">${completed}</div><div class="label">완료</div></div>
    <div class="stat-card"><div class="num">${tasks.length}</div><div class="label">전체</div></div>
  `;
}

function renderTasks() {
  const list = document.getElementById('taskList');
  let filtered = tasks;
  if (currentFilter === 'pending' || currentFilter === 'in_progress' || currentFilter === 'completed') {
    filtered = tasks.filter(t => t.status === currentFilter);
  } else if (currentFilter === 'high') {
    filtered = tasks.filter(t => t.priority === 'high');
  }
  // Sort: in_progress first, then pending, then completed; within same status, high priority first
  const priorityOrder = { high: 0, medium: 1, low: 2 };
  const statusOrder = { in_progress: 0, pending: 1, completed: 2 };
  filtered.sort((a, b) => {
    const s = (statusOrder[a.status] || 1) - (statusOrder[b.status] || 1);
    if (s !== 0) return s;
    return (priorityOrder[a.priority] || 1) - (priorityOrder[b.priority] || 1);
  });

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>작업이 없습니다.<br>+ 버튼을 눌러 새 작업을 추가하세요.</p></div>`;
    return;
  }

  list.innerHTML = filtered.map(t => `
    <div class="task-card ${t.priority} ${t.status === 'completed' ? 'completed-task' : ''}" data-id="${t.id}">
      <div class="title">${escHtml(t.title)}</div>
      ${t.description ? `<div class="desc">${escHtml(t.description)}</div>` : ''}
      <div class="task-meta">
        <span class="priority-badge ${t.priority}">${t.priority}</span>
        ${(t.tags || []).map(tag => `<span class="tag">${escHtml(tag)}</span>`).join('')}
        <span class="tag">${t.createdFrom || 'mobile'}</span>
      </div>
      <div class="task-actions">
        ${t.status !== 'completed' ? `
          <button class="btn-progress" onclick="updateStatus('${t.id}','in_progress')">진행중</button>
          <button class="btn-complete" onclick="updateStatus('${t.id}','completed')">완료</button>
        ` : `
          <button class="btn-progress" onclick="updateStatus('${t.id}','pending')">다시 열기</button>
        `}
        <button class="btn-delete" onclick="deleteTask('${t.id}')">삭제</button>
      </div>
    </div>
  `).join('');
}

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function updateStatus(id, status) {
  await fetch(`${API}/tasks/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ status })
  });
  fetchTasks();
}

async function deleteTask(id) {
  if (!confirm('이 작업을 삭제하시겠습니까?')) return;
  await fetch(`${API}/tasks/${id}`, { method: 'DELETE' });
  fetchTasks();
}

// Modal
const overlay = document.getElementById('modalOverlay');
const fabBtn = document.getElementById('fabBtn');

fabBtn.addEventListener('click', () => {
  document.getElementById('editId').value = '';
  document.getElementById('modalTitle').textContent = '새 작업 추가';
  document.getElementById('submitBtn').textContent = '작업 추가';
  document.getElementById('titleInput').value = '';
  document.getElementById('descInput').value = '';
  document.getElementById('priorityInput').value = 'medium';
  editTags = [];
  renderTagList();
  overlay.classList.add('show');
  setTimeout(() => document.getElementById('titleInput').focus(), 300);
});

overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.remove('show');
});

// Tags
document.getElementById('addTagBtn').addEventListener('click', addTag);
document.getElementById('tagInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); addTag(); }
});

function addTag() {
  const input = document.getElementById('tagInput');
  const tag = input.value.trim();
  if (tag && !editTags.includes(tag)) {
    editTags.push(tag);
    renderTagList();
  }
  input.value = '';
}

function renderTagList() {
  document.getElementById('tagList').innerHTML = editTags
    .map((t, i) => `<span class="tag" onclick="removeTag(${i})">${escHtml(t)} ✕</span>`)
    .join('');
}

function removeTag(i) {
  editTags.splice(i, 1);
  renderTagList();
}

// Submit
document.getElementById('submitBtn').addEventListener('click', async () => {
  const title = document.getElementById('titleInput').value.trim();
  if (!title) { alert('작업 제목을 입력하세요.'); return; }

  const body = {
    title,
    description: document.getElementById('descInput').value.trim(),
    priority: document.getElementById('priorityInput').value,
    tags: [...editTags],
  };

  const editId = document.getElementById('editId').value;
  if (editId) {
    await fetch(`${API}/tasks/${editId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } else {
    await fetch(`${API}/tasks`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  overlay.classList.remove('show');
  fetchTasks();
});

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTasks();
  });
});

// Task card click to edit
document.getElementById('taskList').addEventListener('click', (e) => {
  const card = e.target.closest('.task-card');
  if (!card || e.target.tagName === 'BUTTON') return;
  const id = card.dataset.id;
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  document.getElementById('editId').value = task.id;
  document.getElementById('modalTitle').textContent = '작업 수정';
  document.getElementById('submitBtn').textContent = '수정 저장';
  document.getElementById('titleInput').value = task.title;
  document.getElementById('descInput').value = task.description || '';
  document.getElementById('priorityInput').value = task.priority;
  editTags = [...(task.tags || [])];
  renderTagList();
  overlay.classList.add('show');
});

// Auto-refresh every 30 seconds
setInterval(fetchTasks, 30000);
fetchTasks();
</script>
</body>
</html>
